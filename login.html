<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesíon- Vivero Raíz</title>
    <style>
        body {
            background-color: #56ea67;
            font-family: sans-serif;
        }
    </style>

</head>

<body>
    <strong>
        <p>Gestión del catalgo
    </strong>
    <h2 style="color: white;">Todo lo que crece, ordenado.</h2>
    <hr>
    <h1>Inicio de sesíon</h1>
    <strong>
        <p>Ingrese sus datos para ingresar a la cuenta.
    </strong>
    <form>
        <p>
            <label for="email">Correo electronico </label><br>
            <input type="email" id="email" placeholder="ejemplonicomt@correo.com"><br>
        </p>
        <p>
            <label for="password">Contraseña</label><br>
            <input type="password" id="password">
        </p>
        <p>
            <input type="checkbox" id="keep-logged">
            <label for="keep-logged">¿Recordar sesíon?</label>
        </p>
        <p>
            <button type="submit">Ingresar</button>
        </p>
        <p style="background-color: #d9383a; color: white; padding: 10px; border-radius: 5px; display: inline-block;">
            <strong>El correo o la contraseña no coinciden. Probá de nuevo.</strong>
        </p>
        <p><a href="#">¿Olvidaste tu contraseña?</a></p>
        <p>¿No tenés cuenta? <a href="#">Registrate</a></p>


    </form>

</body>

</html>
