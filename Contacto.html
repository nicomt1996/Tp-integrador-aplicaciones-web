<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactoViveroRaiz</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <img src="./multimedia/ViveroPortada.jpg" alt="Portada de Vivero Raíz">
        <nav>
            <a href="./index.html">Inicio</a>
            <a href="./login.html">Iniciar sesion</a>
            <a href="./registro.html">Registrarse</a>
            <a href="./nosotros.html">Sobre Nosotros</a>
            <a href="./catalogo.html">Nuestro catalogo</a>
        </nav>
    </header>

    <main class="contenedor-textos">
        <h2>Contactanos</h2>
        <p>A continuacion te pediremos tus datos para contactarnos con usted a la brevedad.</p>
        <div class="contenedor-form">
            <form class="Caja-form">
                <p>
                    <label for="nombre">Nombre y apellido:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </p>
                <p>
                    <label for="email">Correo electronico:</label>
                    <input type="email" id="email" placeholder="ejemplonicomt@correo.com" required>
                </p>
                <p>
                    <label for="telefono">Numero de telefono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </p>
                <p style="display: flex; align-items: flex-start; justify-content: space-between;">
                    <label for="motivo" style="margin-top: 5px;">Motivo de consulta:</label>
                    <textarea id="motivo" name="motivo" placeholder="Escribe aquí tu consulta..." required
                        style="width: 100%; max-width: 180px; height: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-family: sans-serif; resize: none;"></textarea>
                </p>

                <p style="justify-content: center; display: flex;">
                    <button type="submit" class="btn-vivero" style="border: none; ">Enviar</button>
                </p>
            </form>
        </div>
    </main>
    <footer class="footer-generico">
        <div>
            <h3>Ubicación</h3>
            <p>Avenida siempre viva, Talo 347</p>
        </div>
        <div>
            <h3>Nuestras redes</h3>
            <a href="#"
                style="color: rgb(2, 29, 20); margin-right: 15px; text-decoration: none; font-weight: bold;">Instagram</a>
            <a href="#" style="color: rgb(2, 29, 20); text-decoration: none; font-weight: bold;">Pinterest</a>
        </div>
    </footer>
</body>

</html>
